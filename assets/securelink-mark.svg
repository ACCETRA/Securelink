<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">SecureLink logo</title>
  <desc id="desc">A violet shield containing connected cyan mesh nodes.</desc>
  <defs>
    <linearGradient id="shield" x1="38" y1="18" x2="218" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="#0B1020"/>
  <path d="M128 25 207 56v62c0 53-33 92-79 113-46-21-79-60-79-113V56l79-31Z" fill="url(#shield)"/>
  <path d="m81 106 47-30 48 30-19 55h-58l-18-55Z" fill="none" stroke="#67E8F9" stroke-width="7" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="m81 106 47 55 48-55M128 76v85" stroke="#CFFAFE" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <g fill="#ECFEFF" stroke="#06B6D4" stroke-width="4">
    <circle cx="81" cy="106" r="10"/><circle cx="128" cy="76" r="10"/>
    <circle cx="176" cy="106" r="10"/><circle cx="128" cy="161" r="10"/>
  </g>
</svg>
